name = "export_mlp_bank_sweep"
baseline = "root_train_gpt"
script_path = "train_gpt.py"
track = "non_record"
resource_class = "runpod_1xh100"
seed_mode = "fixed"
estimator_family = "root_public_2026_03_23"
required_nonempty_env = ["INIT_STATE_DICT_PATH"]
tags = ["export", "mlp_bank", "fragility"]
notes = "Run on a fixed checkpoint via INIT_STATE_DICT_PATH to compare MLP int6 versus int5 while keeping embedding at int8."

[promotion]
candidate = "exploratory"
name = "Export MLP Bank Sweep"
blurb = "Export-only sweep for MLP int6 versus int5 on the root trainer."

[env]
DATA_PATH = "./data/datasets/fineweb10B_sp1024"
TOKENIZER_PATH = "./data/tokenizers/fineweb_1024_bpe.model"
VOCAB_SIZE = 1024
TRAIN_SEQ_LEN = 1024
TRAIN_BATCH_TOKENS = 524288
NUM_LAYERS = 9
MODEL_DIM = 512
MLP_MULT = 2
ITERATIONS = 0
WARMUP_STEPS = 0
VAL_LOSS_EVERY = 0
MAX_WALLCLOCK_SECONDS = 0
INIT_STATE_DICT_PATH = ""
EXPORT_SCHEME = "mixed_family"
EXPORT_COMPRESSOR = "zlib"
EXPORT_LOWBIT_CATEGORIES = "attn,mlp"
EXPORT_INT8_PATTERNS = "tok_emb"
EXPORT_FP16_PATTERNS = ""
EXPORT_ATTN_CLIP_RANGE = 31
EXPORT_MLP_CLIP_RANGE = 31

[matrix]
EXPORT_MLP_CLIP_RANGE = [31, 15]
