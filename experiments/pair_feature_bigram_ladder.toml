name = "pair_feature_bigram_ladder"
baseline = "smear_bigram_record_script"
script_path = "records/track_10min_16mb/2026-03-20_Int6_MLP3x_SmearGate_BigramHash_MuonWD_SWA/train_gpt.py"
track = "non_record"
resource_class = "runpod_1xh100"
seed_mode = "fixed"
estimator_family = "root_public_2026_03_23"
tags = ["pair_feature", "bigram", "smeargate", "research"]
notes = "Exploratory 1xH100 ladder over BigramHash capacity on the existing SmearGate + int6/zstd record script."

[promotion]
candidate = "exploratory"
name = "Pair Feature Bigram Ladder"
blurb = "Exploratory ladder for BigramHash capacity on top of the SmearGate record script."

