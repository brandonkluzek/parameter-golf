TRAIN_SEQ_LEN = 2048
TRAIN_BATCH_TOKENS = 786432
NUM_LAYERS = 9
MODEL_DIM = 512
MLP_MULT = 3.0
ITERATIONS = 20000
WARMDOWN_ITERS = 3000
VAL_LOSS_EVERY = 500
TRAIN_LOG_EVERY = 100
WARMUP_STEPS = 20
MAX_WALLCLOCK_SECONDS = 600
