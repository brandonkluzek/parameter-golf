SCALAR_LR = 0.02
MUON_MOMENTUM = 0.99
MUON_MOMENTUM_WARMUP_START = 0.92
MUON_MOMENTUM_WARMUP_STEPS = 1500
GRAD_CLIP_NORM = 0.3
WEIGHT_DECAY = 0.04
EVAL_STRIDE = 64
BIGRAM_DIM = 128
SWA_ENABLED = 1
SWA_START_FRAC = 0.5
SWA_EVERY = 50
EXPORT_SCHEME = "mixed_family"
